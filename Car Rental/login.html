<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CarRental</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)),
    url("https://images.unsplash.com/photo-1503376780353-7e6692767b70")
    center/cover no-repeat;

    animation: fadeIn 0.8s ease;
}

.container{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.95);
    padding:35px;
    border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#111;
    font-size:32px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    color:#333;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    transition:0.3s;
}

input:focus{
    outline:none;
    border-color:orange;
    box-shadow:0 0 8px rgba(255,165,0,0.4);
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:orange;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#e69500;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:18px;
    text-decoration:none;
    color:#ff8c00;
    font-weight:bold;
}

.back-link:hover{
    text-decoration:underline;
}

@media(max-width:500px){

.container{
    width:90%;
    padding:25px;
}

h2{
    font-size:28px;
}

}
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="container">

<h2>Login</h2>

<form action="Car_home.html" method="get">

<div class="form-group">
<label for="email">Email Address</label>
<input type="email" placeholder="Enter your email" id="email" name="email" required>
</div>

<div class="form-group">
<label for="password">Password</label>
<input type="password" placeholder="Enter your password" id="password" name="password" required>
</div>

<button type="submit">Login</button>

</form>

<a href="signup.html" class="back-link">
Not yet registered? Sign Up
</a>

</div>

</body>
</html>
