<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - CarRental</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body{
  min-height:100vh; display:flex; justify-content:center; align-items:center;
  background: linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)),
  url("https://images.unsplash.com/photo-1503376780353-7e6692767b70") center/cover no-repeat;
  animation: fadeIn 0.8s ease;
}
.container{
  width:100%; max-width:420px; background:rgba(255,255,255,0.95);
  padding:35px; border-radius:15px; box-shadow:0 8px 25px rgba(0,0,0,0.3);
}
h2{ text-align:center; margin-bottom:25px; color:#111; font-size:32px; }
.form-group{ margin-bottom:18px; }
label{ display:block; margin-bottom:6px; color:#333; font-weight:bold; }
input{
  width:100%; padding:12px; border:1px solid #ddd;
  border-radius:8px; font-size:15px; transition:0.3s;
}
input:focus{ outline:none; border-color:orange; box-shadow:0 0 8px rgba(255,165,0,0.4); }
.error{ color:red; font-size:13px; margin-top:4px; display:none; }
button{
  width:100%; padding:13px; border:none; border-radius:8px;
  background:orange; color:white; font-size:17px; font-weight:bold; cursor:pointer; transition:0.3s;
}
button:hover{ background:#e69500; }
.back-link{
  display:block; text-align:center; margin-top:18px;
  text-decoration:none; color:#ff8c00; font-weight:bold;
}
.back-link:hover{ text-decoration:underline; }
@media(max-width:500px){ .container{ width:90%; padding:25px; } h2{ font-size:28px; } }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div class="container">
  <h2>Create Account</h2>

  <div class="form-group">
    <label for="username">Full Name</label>
    <input type="text" placeholder="Enter your full name" id="username" required>
    <div class="error" id="nameError">Name must contain only letters.</div>
  </div>
  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" placeholder="Enter your email" id="email" required>
    <div class="error" id="emailError">Enter a valid email address.</div>
  </div>
  <div class="form-group">
    <label for="phone">Phone Number</label>
    <input type="text" placeholder="10-digit phone number" id="phone" maxlength="10" required>
    <div class="error" id="phoneError">Phone must be exactly 10 digits.</div>
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" placeholder="Create a password (min 8 chars)" id="password" required>
    <div class="error" id="passError">Password must be at least 8 characters.</div>
  </div>

  <button onclick="doSignup()">Sign Up</button>

  <a href="login.html" class="back-link">Already have an account? Login here</a>
</div>

<script>
function doSignup() {
  const name     = document.getElementById('username').value.trim();
  const email    = document.getElementById('email').value.trim();
  const phone    = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value.trim();

  // Hide all errors first
  document.querySelectorAll('.error').forEach(e => e.style.display = 'none');

  let valid = true;

  if (!/^[A-Za-z ]+$/.test(name) || name.length < 2) {
    document.getElementById('nameError').style.display = 'block'; valid = false;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    document.getElementById('emailError').style.display = 'block'; valid = false;
  }
  if (!/^[0-9]{10}$/.test(phone)) {
    document.getElementById('phoneError').style.display = 'block'; valid = false;
  }
  if (password.length < 8) {
    document.getElementById('passError').style.display = 'block'; valid = false;
  }

  if (!valid) return;

  // ✅ Save user to localStorage
  const user = { name, email, phone, password };
  localStorage.setItem('crUser', JSON.stringify(user));

  // Also create a session (auto-login after signup)
  localStorage.setItem('crSession', JSON.stringify({
    name    : name,
    email   : email,
    loggedIn: true
  }));

  // Clear any old bookings for a fresh account
  // (Keep existing bookings if re-registering with same account)
  if (!localStorage.getItem('crBookings')) {
    localStorage.setItem('crBookings', JSON.stringify([]));
  }

  alert('✅ Account created successfully! Welcome to CarRental.');
  window.location.href = 'Car_home.html';
}

// Allow Enter key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSignup();
});
</script>
</body>
</html>
